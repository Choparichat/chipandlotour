<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chip' n Lo Tour</title>
<meta name="description" content="“Saw that, done those” is such a common cliché among frequent fliers. But what if this turns out to be one of the most meaningful trips you've ever taken — where learning and experiencing open your eyes to a new vision that enriches your quality of life?">
<meta property="og:type" content="website">
<meta property="og:title" content="Chip' n Lo Tour">
<meta property="og:description" content="“Saw that, done those” is such a common cliché among frequent fliers. But what if this turns out to be one of the most meaningful trips you've ever taken — where learning and experiencing open your eyes to a new vision that enriches your quality of life?">
<meta property="og:image" content="images/img-02.jpg">
<link rel="icon" href="images/img-01.png">
<link rel="apple-touch-icon" href="images/img-01.png">
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Figtree:wght@400;500;600;700&amp;family=Noto+Serif+Thai:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style id="app-style">
  #live-reviews{margin-bottom:8px}
  #reviews.has-live .rv-track,#reviews.has-live .rv-nav{display:none}

  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F4EFE6;
    --ink:#241F19; --muted:#6E665A; --border:#E7DFD1;
    --primary:#0F6E5C; --primary-ink:#0B5648; --gold:#B4832A;
    --shadow:0 1px 2px rgba(40,32,20,.06),0 8px 24px rgba(40,32,20,.06);
    --radius:16px; --maxw:1120px;
    --serif:"Fraunces","Noto Serif Thai",Georgia,serif;
    --sans:"Figtree","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    color-scheme:light dark;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151210; --surface:#201B16; --surface-2:#2A241D;
      --ink:#F2ECE1; --muted:#A79C8B; --border:#372F26;
      --primary:#2FA187; --primary-ink:#4FBFA3; --gold:#D6A64A;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151210; --surface:#201B16; --surface-2:#2A241D;
    --ink:#F2ECE1; --muted:#A79C8B; --border:#372F26;
    --primary:#2FA187; --primary-ink:#4FBFA3; --gold:#D6A64A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  img{max-width:100%;display:block}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.12;letter-spacing:-.01em;text-wrap:balance;margin:0}
  a{color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px}
  .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:.5em;border:1px solid transparent;border-radius:999px;padding:.72em 1.4em;font-family:var(--sans);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:17px;height:17px;flex:none}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-ink)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-sm{padding:.5em 1em;font-size:.85rem}

  /* header */
  header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;gap:18px;height:66px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.28rem;font-weight:600;text-decoration:none;letter-spacing:-.01em}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--gold));display:grid;place-items:center;color:#fff;flex:none}
  .brand .logo svg{width:20px;height:20px}
  .brand .logo{position:relative}
  .brand .logo.img{background:none;width:auto;height:40px;max-width:170px;border-radius:0}
  .brand .logo.img img{height:40px;width:auto;max-width:170px;object-fit:contain}
  .logo-hint{display:none;position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:.7rem;font-weight:600;padding:.3em .7em;border-radius:999px;white-space:nowrap;pointer-events:none;z-index:5}
  body.editing .brand .logo{outline:1.5px dashed color-mix(in srgb,var(--primary) 70%,transparent);outline-offset:4px;cursor:pointer}
  body.editing .brand .logo:hover{filter:brightness(1.08)}
  body.editing .logo-hint{display:block}
  .logo-reset{display:none;width:24px;height:24px;border-radius:7px;border:0;background:rgba(180,40,30,.92);color:#fff;cursor:pointer;align-items:center;justify-content:center;flex:none;margin-left:-4px}
  .logo-reset svg{width:13px;height:13px}
  body.editing .logo-reset{display:inline-flex}
  .nav-links{display:flex;gap:22px;margin-left:8px}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;padding:6px 2px;border-bottom:2px solid transparent}
  .nav-links a:hover{color:var(--ink)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .langtog{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;font-size:.82rem;font-weight:600}
  .langtog button{border:0;background:transparent;color:var(--muted);padding:.42em .8em;cursor:pointer;font-family:var(--sans);font-weight:600}
  .langtog button.on{background:var(--ink);color:var(--bg)}
  .menu-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--ink)}
  .menu-toggle svg{width:20px;height:20px}
  .hide-sm{display:inline-flex}

  /* hero */
  .hero{position:relative;overflow:hidden;z-index:0}
  .hero-media{position:absolute;inset:0}
  .hero-media .ph,.hero-media img{width:100%;height:100%;object-fit:cover}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(15,20,18,.28),rgba(15,20,18,.62))}
  .hero-inner{position:relative;z-index:2;padding-block:96px 104px;color:#fff;max-width:720px}
  .hero-inner .eyebrow{color:#ffe9b8}
  .hero h1{font-size:clamp(2.3rem,6vw,3.9rem);margin:.35em 0 .45em;color:#fff}
  .hero p.sub{font-size:clamp(1.02rem,2.2vw,1.22rem);color:rgba(255,255,255,.9);max-width:36em;margin:0 0 1.8em}
  .hero .cta-row{display:flex;gap:12px;flex-wrap:wrap}
  .hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.5)}
  .hero .btn-ghost:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}

  /* top bar */
  .topbar{background:var(--ink);color:var(--bg);font-size:.82rem}
  .topbar .wrap{display:flex;justify-content:flex-end;align-items:center;gap:8px;height:34px}
  .topbar a{color:inherit;text-decoration:none;opacity:.9;display:inline-flex;align-items:center;gap:6px}
  .topbar a:hover{opacity:1}
  .topbar svg{width:14px;height:14px}
  .hero p.tag{font-family:var(--serif);font-style:italic;color:#ffe9b8;font-size:clamp(1rem,2vw,1.15rem);margin:-.6em 0 1.8em;max-width:36em}
  /* moments strip */
  section.moments{padding-block:44px 8px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .mcell{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;background:var(--surface-2)}
  .mcell .ph,.mcell img{width:100%;height:100%;object-fit:cover}
  .mcap{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;padding:.3em .85em;border-radius:999px;font-weight:600;font-size:.85rem;backdrop-filter:blur(4px)}
  /* services */
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .fcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .fcard .ico{width:48px;height:48px;border-radius:14px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center}
  .fcard .ico svg{width:24px;height:24px}
  .fcard h3{font-size:1.3rem}
  .fcard p{margin:0;color:var(--muted);font-size:.98rem;flex:1}
  .fcard .btn{align-self:flex-start;margin-top:6px}

  /* generic section */
  section.blk{padding-block:72px}
  .sec-head{max-width:640px;margin-bottom:38px}
  .sec-head h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin:.25em 0 .3em}
  .sec-head p{color:var(--muted);margin:0;font-size:1.05rem}

  /* about points */
  .points{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .point{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .point .ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center;margin-bottom:14px}
  .point .ico svg{width:23px;height:23px}
  .point h3{font-size:1.2rem;margin-bottom:.35em}
  .point p{margin:0;color:var(--muted);font-size:.98rem}

  /* tours */
  .tours-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
  .tcard .media{aspect-ratio:4/3;position:relative;overflow:hidden}
  .tcard .media .ph,.tcard .media img{width:100%;height:100%;object-fit:cover}
  .tcard .region{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:.74rem;font-weight:600;letter-spacing:.04em;padding:.32em .7em;border-radius:999px;backdrop-filter:blur(4px)}
  .tcard .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tcard h3{font-size:1.28rem}
  .tcard .desc{color:var(--muted);font-size:.96rem;margin:0;flex:1}
  .tcard .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px;padding-top:14px;border-top:1px solid var(--border)}
  .tcard .dur{color:var(--muted);font-size:.88rem;display:inline-flex;align-items:center;gap:.4em}
  .tcard .dur svg{width:14px;height:14px;opacity:.7;flex:none}
  .tcard .price{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
  .tcard .price b{color:var(--primary);font-weight:600}
  .tcard .act{margin-top:12px}
  .tcard .act .btn{width:100%;justify-content:center}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;gap:14px}
  .gcell{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2)}
  .gcell:nth-child(4n+1){grid-row:span 2}
  .gcell .ph,.gcell img{width:100%;height:100%;object-fit:cover}

  /* reviews */
  .rv-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .rv-top .sec-head{margin-bottom:0}
  .rv-nav{display:flex;gap:8px}
  .rv-nav button{width:42px;height:42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .rv-nav button:hover{border-color:var(--primary);color:var(--primary)}
  .rv-nav svg{width:18px;height:18px}
  .rv-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 14px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .rv-card{position:relative;flex:0 0 min(340px,84vw);scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .rv-head{display:flex;align-items:center;gap:12px}
  .rv-av{width:40px;height:40px;border-radius:999px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .rv-name{font-weight:700;line-height:1.3}
  .rv-date{font-size:.82rem;color:var(--muted)}
  .rv-stars{display:flex;gap:2px;color:#E8A317}
  .rv-stars span{font-size:1.1rem;line-height:1}
  .rv-stars span.off{color:var(--border)}
  body.editing .rv-stars span{cursor:pointer}
  .rv-text{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin:0;color:var(--ink);font-size:.97rem;flex:1}
  .rv-card.open .rv-text,body.editing .rv-text{-webkit-line-clamp:unset;display:block}
  .rv-track{align-items:flex-start}
  .rv-toggle{display:none;align-self:flex-start;border:0;background:none;padding:0;color:var(--primary);font:600 .88rem var(--sans);cursor:pointer}
  .rv-toggle.show{display:inline}
  body.editing .rv-toggle{display:none}
  .rv-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .rv-ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
  .rv-ph img{width:100%;height:100%;object-fit:cover}
  .rv-ph .more{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;font-weight:700;font-size:1.1rem;display:grid;place-items:center}
  .rv-ph .x{display:none;position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(180,40,30,.95);color:#fff;cursor:pointer;align-items:center;justify-content:center}
  .rv-ph .x svg{width:12px;height:12px}
  body.editing .rv-ph .x{display:flex}
  body.editing .rv-ph{cursor:default}
  .rv-phadd{display:none;aspect-ratio:1;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--primary) 60%,transparent);background:transparent;color:var(--primary);font:600 .72rem var(--sans);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .rv-phadd svg{width:18px;height:18px}
  body.editing .rv-phadd{display:flex}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.9);color:#241F19;cursor:pointer;display:grid;place-items:center;font-size:1.4rem}
  .lb-prev{left:14px}.lb-next{right:14px}
  .qr-view .box.photo{max-width:min(720px,100%);padding:10px}
  .qr-view .box.photo img{width:min(600px,84vw);max-height:78vh;object-fit:contain;margin:0 auto}
  .rw-box{background:var(--surface);color:var(--ink);border-radius:20px;padding:26px;width:min(460px,100%);max-height:90vh;overflow:auto;text-align:left;position:relative}
  .rw-box h3{font-size:1.4rem;margin-bottom:.3em}
  .rw-box .hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
  .rw-box label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
  .rw-box input,.rw-box textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.7em .85em}
  .rw-box textarea{min-height:120px;resize:vertical}
  .rw-box input:focus,.rw-box textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
  .rw-stars{display:flex;gap:4px}
  .rw-stars button{border:0;background:none;font-size:1.9rem;line-height:1;color:var(--border);cursor:pointer;padding:0 2px}
  .rw-stars button.on{color:#E8A317}
  .rw-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .rw-actions .btn{justify-content:center;width:100%}
  .rw-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.2rem;line-height:1}
  .rw-err{color:#b4281e;font-size:.88rem;margin-top:8px;min-height:1.2em}
  body.editing .rv-write{display:none}
  .rv-src{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .rv-src b{font-weight:700;background:linear-gradient(90deg,#4285F4,#EA4335,#FBBC05,#34A853);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rv-more{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .rv-url{display:none;font-size:.85rem;color:var(--muted)}
  body.editing .rv-url{display:block;flex-basis:100%}
  .rv-empty{display:none;color:var(--muted);font-size:.95rem;padding:18px;border:1.5px dashed var(--border);border-radius:var(--radius)}
  body.editing .rv-empty{display:block}
  .ph{background:linear-gradient(150deg,var(--c1,#0F6E5C),var(--c2,#123B4E));display:grid;place-items:center;position:relative}
  .ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 22% 78%,rgba(255,255,255,.14),transparent 42%),radial-gradient(circle at 82% 22%,rgba(255,255,255,.1),transparent 40%)}
  .ph svg{width:34px;height:34px;opacity:.55;color:#fff;position:relative}

  /* contact */
  .contact-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
  .clist{display:flex;flex-direction:column;gap:2px}
  .crow{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border)}
  .crow:last-child{border-bottom:0}
  .crow .ico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center}
  .crow .ico svg{width:20px;height:20px}
  .crow .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .crow .val{font-weight:600;word-break:break-word}
  .crow .val a{text-decoration:none}
  .crow .val a:hover{color:var(--primary)}
  .contact-cta{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
  .contact-media{position:relative;margin:-30px -30px 24px;aspect-ratio:16/10;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0}
  .contact-media .ph,.contact-media img{width:100%;height:100%;object-fit:cover}
  .contact-cta{overflow:hidden}
  .crow .cbody{flex:1;min-width:0}
  .qr-wrap{margin-top:12px;display:flex}
  .qr{flex:none;position:relative;width:150px;height:150px;border-radius:10px;border:1px solid var(--border);background:#fff;padding:5px;cursor:zoom-in}
  .qr img{width:100%;height:100%;object-fit:contain}
  .qr-add{display:none;flex:none;width:150px;height:150px;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--primary) 60%,transparent);background:transparent;color:var(--primary);font:600 .78rem var(--sans);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .qr-add svg{width:20px;height:20px}
  body.editing .qr-add{display:flex}
  body.editing .qr{cursor:pointer}
  .qr-del{display:none;position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:7px;border:0;background:rgba(180,40,30,.95);color:#fff;cursor:pointer;align-items:center;justify-content:center}
  .qr-del svg{width:13px;height:13px}
  body.editing .qr-del{display:flex}
  .qr-hint{display:none;position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 .66rem var(--sans);padding:.2em .6em;border-radius:999px;white-space:nowrap}
  body.editing .qr-hint{display:block}
  .qr-view{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px}
  .qr-view .box{background:#fff;border-radius:18px;padding:18px;max-width:min(360px,100%);text-align:center;color:#241F19}
  .qr-view img{width:100%;height:auto;display:block}
  .qr-view .cap{margin-top:10px;font-weight:600}
  .contact-cta h3{font-size:1.4rem;margin-bottom:.4em}
  .contact-cta p{color:var(--muted);margin:0 0 1.2em}
  .contact-cta .btn{width:100%;justify-content:center;margin-bottom:10px}

  footer.site{border-top:1px solid var(--border);padding-block:34px;color:var(--muted);font-size:.9rem}
  footer.site .frow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

  /* ===== admin / edit ===== */

nuinely committed that we feel great and have good time! And sure we did - we are hopefully coming back!"},{"name":"池田正太","date":"2025","rating":4,"text":"日本人です。\nここでバイクレンタルしました。 フレンドリーでとても良かったです！"},{"name":"Allen Wang","date":"2024","rating":5,"text":"Good price for the two - one day tours I bought (Doi Inthanon Park... & Elephant Sanctuary ...) with friendly service from the owner.","photos":["images/img-14.jpg","images/img-15.jpg","images/img-16.jpg"]},{"name":"Leyla","date":"2024","rating":5,"text":"סוכנות מדהימה דוברי אנגלית\nסגרנו דרכם טיול חצי יום לפילים smile elephant והיה ממש כיף והמחיר הכי זול שמצאנו בהשוואה לשאר המקומות","photos":["images/img-17.jpg","images/img-18.jpg"]},{"name":"Benjamin","date":"2024","rating":5,"text":"We had an exceptional experience with chip' n lo tour. The lovely lady in charge went above and beyond to assist us, not just answering our myriad of questions with patience but also coming to our rescue when we lost our tickets. Her commitment to customer satisfaction is evident, and I wholeheartedly recommend this business to any traveler seeking a seamless experience. Thank you for making our trip memorable!"},{"name":"Amy-Louise Robertson","date":"2024","rating":5,"text":"I had such a great experience with chip'n lo tours! The wonderful lady helped me book two great tours for my time in Chiang Mai. There was no problem with last minute booking for the next day, and there is lots of choice to choose from!!\n\nThe communication is great from chip'n lo, and I was provided with plenty of information about the tour itself and pick up, etc. It was very easy and convenient for me, all I had to do was say the attractions I was interested in, and chip'n lo sorted everything out! Ideal for when you are in holiday-mode 😁\n\nThe tours themselves are well organised and offer jam-packed schedules of exploring.\n\nI would definitely recommend you use chip'n lo for your tour booking needs ☀️☀️☀️☀️☀️"},{"name":"Nazim Bayram","date":"2024","rating":5,"text":"Haben 3 touren gebucht bei chip'n lo tour: doi inthanon, elephant care und doi suthep. Die Doi Suthep Tour war schön, aber der Reiseleiter konnte nicht viel über die Tempel erzählen. Trotzdem waren alle drei Touren toll und es hat sich …"},{"name":"Krzysztof Kłosowski","date":"2024","rating":5,"text":"Bardzo miła, otwarta i wesoła pani właścicielka, która udzieliła nam wszystkich potrzebnych informacji i doradziła jaką wycieczkę wybrać (po angielsku). Wycieczka była dokładnie taka jak pani opowiedziała. Wszystko się zgadzało. Dostaliśmy …"},{"name":"Kiran Kumari","date":"2024","rating":5,"text":"Very helpful person, arranged a day trip with all information and very reason price. Prices are lesser than online packages and a very friendly tour team. Thanks !"},{"name":"Lena","date":"2024","rating":5,"text":"Wszystko dobrze zorganizowane, świetny przewodnik i dobra cena.\nPolecam!"},{"name":"Francis","date":"2024","rating":5,"text":"fantastic tour guide. very friendly and helpful through the process"},{"name":"L H","date":"2023","rating":5,"text":"I have to give Toom five stars! She is so sweet and helpful. She doesn’t only sell tour tickets, but she cares most for my experience. She always asked me how was the tour and how was the activity after I came back. I had booked quite a few camps and tours from her. I’d definitely recommend her to my friends if they come to Chiangmai."},{"name":"Siva Nageshwara rao CH","date":"2023","rating":5,"text":"We are very thrilled to book the trip with Chip' n lo tour.\nVery nice service by the lady - very cheerful and friendly."},{"name":"Dordini Matteo","date":"2023","rating":5,"text":"Vraiment génial, assume où trouver les meilleurs prix avec des remises. Excellente très bon suivi également pendant le séjour vous pouvez quasiment tout lui demander. 👌 …"}],"moments":[{"img":"","c1":"#3E6B3A","c2":"#1E3A22","cap_en":"Meditation","cap_th":"การทำสมาธิ"},{"img":"","c1":"#8A6A2E","c2":"#4A3810","cap_en":"Sincere laughter","cap_th":"เสียงหัวเราะที่จริงใจ"},{"img":"","c1":"#2E6B6B","c2":"#123B3B","cap_en":"Tranquil green forest & stream","cap_th":"ผืนป่าเขียวขจีและลำธารอันสงบ"}],"services":{"eyebrow_en":"What we offer","eyebrow_th":"บริการของเรา","title_en":"Trips shaped around you","title_th":"ทริปที่ออกแบบมาเพื่อคุณ","sub_en":"Tell us what you have in mind — we'll take care of the rest.","sub_th":"บอกเราว่าคุณอยากได้แบบไหน ที่เหลือเราจัดการให้","cards":[{"title_en":"Customizing","title_th":"ออกแบบทริปเอง","body_en":"Throw in what you have in mind. We'll cook it up in 5 minutes, or until you're pleased. We promise never to leave you thinking alone or lead you into a tourist trap.","body_th":"บอกไอเดียที่คุณมีมาได้เลย เราจะจัดทริปให้ภายใน 5 นาที หรือจนกว่าคุณจะพอใจ เราสัญญาว่าจะไม่ปล่อยให้คุณคิดคนเดียว และจะไม่พาคุณไปติดกับดักนักท่องเที่ยว","cta_en":"Get started","cta_th":"เริ่มเลย","link":"#contact"},{"title_en":"Transportation","title_th":"รถรับส่งพร้อมคนขับ","body_en":"A great choice for free spirits who play it by ear and let the real vibe bring them to places and people. Enjoy your holiday at your own pace — we simply make sure you get there in comfort and safety, with a concierge-like driver.","body_th":"เหมาะสำหรับคนรักอิสระที่อยากเที่ยวแบบไม่ต้องวางแผนมาก ปล่อยให้บรรยากาศพาไปพบสถานที่และผู้คน เที่ยวตามจังหวะของคุณเอง เราดูแลให้คุณเดินทางอย่างสะดวกสบายและปลอดภัย พร้อมคนขับที่ดูแลเหมือนผู้ช่วยส่วนตัว","cta_en":"Learn more","cta_th":"ดูรายละเอียด","link":"#contact"},{"title_en":"Special Interest","title_th":"ทริปตามความสนใจพิเศษ","body_en":"Temples and history, photography, local food, trekking or wellness — tell us your passion and we'll build a trip around it.","body_th":"วัดและประวัติศาสตร์ การถ่ายภาพ อาหารท้องถิ่น เดินป่า หรือสุขภาพ บอกความสนใจของคุณ แล้วเราจะออกแบบทริปให้","cta_en":"Learn more","cta_th":"ดูรายละเอียด","link":"#contact"}]}}</script>

  function crow(ico,lbl,val,qrKey){
    var q="";
    if(qrKey){
      var src=data.contact[qrKey];
      if(src) q='<div class="qr" data-qr="'+qrKey+'" data-cap="'+esc(lbl)+'"><img src="'+esc(src)+'" alt="'+esc(lbl)+' QR code"><button class="qr-del" data-qrdel="'+qrKey+'" title="'+(lang==="th"?"ลบ QR":"Remove QR")+'">'+ICON.trash+'</button><span class="qr-hint">'+(lang==="th"?"เปลี่ยน QR":"Change QR")+'</span></div>';
      else q='<button class="qr-add" data-qr="'+qrKey+'">'+ICON.plus+(lang==="th"?"เพิ่ม QR":"Add QR")+'</button>';
    }
    return '<div class="crow"><div class="ico">'+ico+'</div><div class="cbody"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+val+'</div>'+(q?'<div class="qr-wrap">'+q+'</div>':'')+'</div></div>';
  }

  // ---------- data path get/set ----------
  function ref(path){
    var parts=path.split("."), o=data;
    for(var i=0;i<parts.length-1;i++){ var k=parts[i]; k=(/^\d+$/.test(k))?+k:k; o=o[k]; }
    var last=parts[parts.length-1]; last=(/^\d+$/.test(last))?+last:last;
    return {obj:o,key:last};
  }
  function setText(path,val){ var r=ref(path); r.obj[r.key+"_"+lang]=val; }
  function setPlain(path,val){ var r=ref(path); r.obj[r.key]=val; }

  // ---------- bind events ----------
  function bind(){
    // language
    Array.prototype.forEach.call(document.querySelectorAll(".langtog button"),function(b){
      b.onclick=function(){ if(editing) syncEdits(); lang=b.getAttribute("data-lang"); try{localStorage.setItem(LS_LANG,lang);}catch(e){} render(); };
    });
    var mb=document.getElementById("menubtn");
    if(mb) mb.onclick=function(){ document.getElementById("navlinks").classList.toggle("open"); };
    Array.prototype.forEach.call(document.querySelectorAll("#navlinks a"),function(a){ a.onclick=function(){ document.getElementById("navlinks").classList.remove("open"); }; });

    // image uploads
    Array.prototype.forEach.call(document.querySelectorAll(".imgedit"),function(lab){
      var inp=lab.querySelector("input");
      inp.onchange=function(){ if(inp.files&&inp.files[0]) handleImg(lab.getAttribute("data-img"),inp.files[0]); };
    });
    // reviews: "read more" only where text is clamped
    Array.prototype.forEach.call(document.querySelectorAll(".rv-card"),function(card){
      var tx=card.querySelector(".rv-text"), bt=card.querySelector(".rv-toggle");
      if(!tx||!bt) return;
      if(tx.scrollHeight>tx.clientHeight+2) bt.classList.add("show");
      bt.onclick=function(){ var o=card.classList.toggle("open"); bt.textContent=o?(lang==="th"?"ย่อ":"Show less"):(lang==="th"?"อ่านต่อ":"Read more"); };
    });
    // tours: hold the handle and drag to reorder (mouse + touch)
    Array.prototype.forEach.call(document.querySelectorAll(".tcard .drag-h"),function(h){
      h.addEventListener("pointerdown",function(e){
        if(!editing) return;
        e.preventDefault();
        syncEdits();
        var card=h.closest(".tcard"), grid=card.parentNode;
        card.classList.add("dragging"); document.body.classList.add("drag-active");
        
        function move(ev){
          card.style.pointerEvents="none";
          var el=document.elementFromPoint(ev.clientX,ev.clientY);
          card.style.pointerEvents="";
          var over=el&&el.closest?el.closest(".tcard"):null;
          if(over&&over!==card&&over.parentNode===grid){
            var r=over.getBoundingClientRect();
            var after=(ev.clientX>r.left+r.width/2)||(ev.clientY>r.bottom-r.height*0.25);
            grid.insertBefore(card, after?over.nextSibling:over);
          }
          if(ev.clientY<70) window.scrollBy(0,-18); else if(ev.clientY>window.innerHeight-90) window.scrollBy(0,18);
        }
        function up(){
          window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",up);
          document.body.classList.remove("drag-active"); card.classList.remove("dragging");
          var order=Array.prototype.map.call(grid.querySelectorAll(".tcard"),function(c){ return +c.getAttribute("data-ti"); });
          var changed=order.some(function(v,k){ return v!==k; });
          if(changed){ data.tours=order.map(function(k){ return data.tours[k]; }); render(); toast(lang==="th"?"ย้ายแล้ว อย่าลืมกดบันทึก":"Moved — remember to save"); }
        }
        window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
      });
    });
    // visitor "write a review" form -> email to the owner, or post on Google
    var rw=document.getElementById("rvwrite");
    if(rw) rw.onclick=function(){ openReviewForm(); };
    // review photos: view (lightbox) / add / delete
    Array.prototype.forEach.call(document.querySelectorAll("[data-rvph]"),function(el){
      el.onclick=function(e){ if(e.target.closest(".x")||editing) return; openLB(data.reviews[+el.getAttribute("data-rvph")].photos, +el.getAttribute("data-k")); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-rvphdel]"),function(b){
      b.onclick=function(e){ e.stopPropagation(); syncEdits(); data.reviews[+b.getAttribute("data-rvphdel")].photos.splice(+b.getAttribute("data-k"),1); render(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-rvphadd]"),function(b){
      b.onclick=function(){ var i=+b.getAttribute("data-rvphadd"); pickFile(function(f){ compress(f,1200,0.8).then(function(uri){ syncEdits(); var r=data.reviews[i]; r.photos=r.photos||[]; r.photos.push(uri); render(); }).catch(function(){ toast(lang==="th"?"อัปโหลดรูปไม่สำเร็จ":"Could not load image"); }); }); };
    });
    // reviews: arrows + star rating in edit mode
    Array.prototype.forEach.call(document.querySelectorAll("[data-rv]"),function(b){
      b.onclick=function(){ var tr=document.getElementById("rvtrack"); if(!tr) return; var c=tr.querySelector(".rv-card"); var w=c?c.getBoundingClientRect().width+18:320; tr.scrollBy({left:w*(+b.getAttribute("data-rv")),behavior:"smooth"}); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-star]"),function(sp){
      sp.onclick=function(){ if(!editing) return; syncEdits(); data.reviews[+sp.getAttribute("data-star")].rating=+sp.getAttribute("data-v"); render(); };
    });
    // QR codes: edit mode = upload/replace; view mode = enlarge
    Array.prototype.forEach.call(document.querySelectorAll("[data-qr]"),function(el){
      el.addEventListener("click",function(e){
        if(e.target.closest&&e.target.closest(".qr-del")) return;
        var key=el.getAttribute("data-qr");
        if(!editing){
          if(!data.contact[key]) return;
          var v=document.createElement("div"); v.className="qr-view";
          v.innerHTML='<div class="box"><img src="'+esc(data.contact[key])+'" alt=""><div class="cap">'+esc(el.getAttribute("data-cap")||"")+'</div></div>';
          v.onclick=function(){ v.remove(); }; document.body.appendChild(v); return;
        }
        e.preventDefault();
        pickFile(function(f){
          compressLogo(f,800).then(function(uri){ syncEdits(); data.contact[key]=uri; render(); toast(lang==="th"?"ใส่ QR แล้ว อย่าลืมกดบันทึก":"QR added — remember to save"); })
          .catch(function(){ toast(lang==="th"?"อัปโหลดรูปไม่สำเร็จ":"Could not load image"); });
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-qrdel]"),function(b){
      b.onclick=function(e){ e.stopPropagation(); syncEdits(); data.contact[b.getAttribute("data-qrdel")]=""; render(); };
    });
    // logo upload (click the logo in edit mode)
    var lg=document.getElementById("brandlogo");
    if(lg) lg.addEventListener("click",function(e){
      if(!editing) return;
      e.preventDefault(); e.stopPropagation();
      var inp=document.getElementById("logo-input");
      if(!inp){ inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.id="logo-input"; inp.hidden=true; document.body.appendChild(inp);
        inp.onchange=function(){ var f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
          compressLogo(f).then(function(uri){ syncEdits(); data.brand.logo=uri; render(); toast(lang==="th"?"เปลี่ยนโลโก้แล้ว อย่าลืมกดบันทึก":"Logo updated — remember to save"); })
          .catch(function(){ toast(lang==="th"?"อัปโหลดโลโก้ไม่สำเร็จ":"Could not load logo"); });
        };
      }
      inp.click();
    });
    var lr=document.getElementById("logoreset");
    if(lr) lr.onclick=function(){ syncEdits(); data.brand.logo=""; render(); };
    // delete card
    Array.prototype.forEach.call(document.querySelectorAll(".card-del"),function(b){
      b.onclick=function(){ syncEdits(); var arr=b.getAttribute("data-del"), i=+b.getAttribute("data-i"); data[arr].splice(i,1); render(); };
    });
    // add
    Array.prototype.forEach.call(document.querySelectorAll("[data-add]"),function(b){
      b.onclick=function(){ syncEdits(); var which=b.getAttribute("data-add");
        if(which==="tours") data.tours.push({img:"",c1:"#0F6E5C",c2:"#123B4E",region_en:"Region",region_th:"พื้นที่",title_en:"New tour",title_th:"ทัวร์ใหม่",desc_en:"Describe this tour...",desc_th:"อธิบายทัวร์นี้...",dur_en:"Full day",dur_th:"เต็มวัน",price:"0"});
        else if(which==="reviews"){ data.reviews=data.reviews||[]; data.reviews.push({name:(lang==="th"?"ชื่อผู้รีวิว":"Reviewer name"),date:(lang==="th"?"วันที่":"Date"),rating:5,text:(lang==="th"?"วางข้อความรีวิวจาก Google Maps ที่นี่":"Paste the review text from Google Maps here")}); }
        else data.gallery.push({img:"",c1:"#2E6B6B",c2:"#123B3B"});
        render();
      };
    });
  }

  // ---------- editing ----------
  function applyEditing(){
    document.body.classList.toggle("editing",editing);
    Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"),function(el){
      if(editing){ el.setAttribute("contenteditable","true"); el.setAttribute("spellcheck","false"); }
      else el.removeAttribute("contenteditable");
    });
  }
  function syncEdits(){
    if(!editing) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"),function(el){
      var path=el.getAttribute("data-edit");
      var val=el.textContent.replace(/ /g," ").trim();
      if(path==="brand.name"||path==="contact.phone"||path==="contact.email"||path==="contact.line"||path==="contact.whatsapp"||path==="contact.wechat"||path==="reviewsSection.url"||/^reviews\./.test(path)||/\.price$/.test(path)){
        setPlain(path,val);
      } else {
        setText(path,val);
      }
    });
  }
  function handleImg(path,file){
    compress(file,path.indexOf("hero")===0?2000:1400,0.82).then(function(uri){
      syncEdits(); setPlain(path,uri); render();
    }).catch(function(){ toast(lang==="th"?"อัปโหลดรูปไม่สำเร็จ":"Could not load image"); });
  }

      +'<h3>'+(TH?"เขียนรีวิวถึงเรา":"Write us a review")+'</h3>'
      +'<p class="hint">'+(TH?"ขอบคุณที่เที่ยวกับเรา! รีวิวของคุณจะแสดงบนเว็บไซต์หลังจากทีมงานตรวจสอบแล้ว":"Thank you for travelling with us! Your review will appear on our website once our team has checked it.")+'</p>'
      +'<label for="rw-name">'+(TH?"ชื่อของคุณ":"Your name")+'</label><input id="rw-name" maxlength="80" autocomplete="name">'
      +'<label>'+(TH?"ให้คะแนน":"Your rating")+'</label><div class="rw-stars" id="rw-stars"></div>'
      +'<label for="rw-text">'+(TH?"รีวิวของคุณ":"Your review")+'</label><textarea id="rw-text" maxlength="3000" placeholder="'+(TH?"เล่าประสบการณ์ทริปของคุณ…":"Tell us about your trip…")+'"></textarea>'
      +'<div class="rw-err" id="rw-err"></div>'
      +'<div class="rw-actions">'
      +(c.email?'<button class="btn btn-primary" type="button" id="rw-send">'+ICON.mail+(TH?"ส่งรีวิวทางอีเมล":"Send review by email")+'</button>':'')
      +(rs.url?'<a class="btn btn-ghost" target="_blank" rel="noopener" href="'+esc(rs.url)+'" id="rw-google">'+(TH?"หรือรีวิวบน Google Maps":"Or review us on Google Maps")+'</a>':'')
      +'</div></div>';
    function stars(){ var h=""; for(var k=1;k<=5;k++) h+='<button type="button" data-v="'+k+'" class="'+(k<=rating?"on":"")+'" aria-label="'+k+' star">★</button>'; v.querySelector("#rw-stars").innerHTML=h; }
    stars();
    v.addEventListener("click",function(e){
      var tg=e.target;
      if(tg===v||tg.classList.contains("rw-close")){ v.remove(); return; }
      var sb=tg.closest?tg.closest("#rw-stars button"):null;
      if(sb){ rating=+sb.getAttribute("data-v"); stars(); return; }
      if(tg.closest&&tg.closest("#rw-send")){
        var name=v.querySelector("#rw-name").value.trim(), text=v.querySelector("#rw-text").value.trim(), err=v.querySelector("#rw-err");
        if(!name||!text){ err.textContent=TH?"กรุณากรอกชื่อและรีวิว":"Please add your name and review."; return; }
        var subj=(TH?"รีวิวจากเว็บไซต์ – ":"Website review – ")+name;
        var body=(TH?"ชื่อ: ":"Name: ")+name+"\n"+(TH?"คะแนน: ":"Rating: ")+rating+"/5 "+"★★★★★".slice(0,rating)+"\n\n"+text;
        window.location.href="mailto:"+encodeURIComponent(c.email)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
        err.style.color="var(--primary)"; err.textContent=TH?"กำลังเปิดแอปอีเมลของคุณ… กดส่งในอีเมลเพื่อยืนยัน":"Opening your email app… press Send there to submit.";
      }
    });
    document.body.appendChild(v);
    setTimeout(function(){ var n=v.querySelector("#rw-name"); if(n) n.focus(); },30);
  }
  function openLB(list,k){
    if(!list||!list.length) return;
    var v=document.createElement("div"); v.className="qr-view";
    function show(){ v.innerHTML='<div class="box photo"><img src="'+esc(list[k])+'" alt=""></div>'+(list.length>1?'<button class="lb-nav lb-prev" aria-label="Previous">‹</button><button class="lb-nav lb-next" aria-label="Next">›</button>':''); }
    show();
    v.onclick=function(e){ var t=e.target;
      if(t.classList.contains("lb-prev")){ k=(k-1+list.length)%list.length; show(); return; }
      if(t.classList.contains("lb-next")){ k=(k+1)%list.length; show(); return; }
      v.remove(); };
    document.body.appendChild(v);
  }
  function pickFile(cb){
    var inp=document.getElementById("qr-input");
    if(!inp){ inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.id="qr-input"; inp.hidden=true; document.body.appendChild(inp); }
    inp.onchange=function(){ var f=inp.files&&inp.files[0]; inp.value=""; if(f) cb(f); };
    inp.click();
  }
  function compressLogo(file,maxDim){
    var MAX=maxDim||480;
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ URL.revokeObjectURL(url);
        var w=img.naturalWidth||480,h=img.naturalHeight||480,m=Math.max(w,h);
        if(m>MAX){ var sc=MAX/m; w=Math.round(w*sc); h=Math.round(h*sc); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL("image/png")); }catch(e){ rej(e); }
      };
      img.onerror=rej; img.src=url;
    });
  }
  function compress(file,maxDim,q){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ URL.revokeObjectURL(url);
        var w=img.naturalWidth,h=img.naturalHeight,m=Math.max(w,h);
        if(m>maxDim){ var sc=maxDim/m; w=Math.round(w*sc); h=Math.round(h*sc); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL("image/jpeg",q)); }catch(e){ rej(e); }
      };
      img.onerror=rej; img.src=url;
    });
  }

  // ---------- admin bar ----------
  function buildAdminBar(){
    var bar=document.createElement("div"); bar.id="adminbar";
    bar.innerHTML='<div class="ab-msg" id="ab-msg"></div><div class="ab-btns" id="ab-btns"></div>';
    document.body.appendChild(bar);
    renderAdminBar();
  }
  function renderAdminBar(){
    var msg=document.getElementById("ab-msg"), btns=document.getElementById("ab-btns");
    if(!editing){
      msg.innerHTML=(lang==="th"?"คุณเข้าสู่ระบบในฐานะผู้ดูแลเว็บไซต์":"You're signed in as the site admin")+' <small>'+(lang==="th"?"— แตะแก้ไขเพื่อเปลี่ยนข้อความ รูปภาพ และโลโก้":"— tap Edit to change text, photos & logo")+'</small>';
      btns.innerHTML='<button class="btn btn-primary btn-sm" id="ab-edit">'+(lang==="th"?"แก้ไขเว็บไซต์":"Edit site")+'</button>';
      document.getElementById("ab-edit").onclick=function(){ try{ editing=true; editEnteredAt=Date.now(); render(); renderAdminBar(); toast(lang==="th"?"โหมดแก้ไข: แตะข้อความหรือรูปเพื่อเปลี่ยน":"Edit mode: tap any text or photo to change it"); }catch(e){ showBanner("⚠ "+(e&&e.message||e)); } };
    } else {
      msg.innerHTML='<strong>'+(lang==="th"?"โหมดแก้ไข":"Editing")+'</strong> <small>'+(lang==="th"?"— แตะข้อความ/รูป · สลับ EN·TH เพื่อแก้อีกภาษา":"— tap text/photos · switch EN·TH to edit each language")+'</small>';
      btns.innerHTML='<button class="btn btn-ghost btn-sm" id="ab-cancel">'+(lang==="th"?"ยกเลิก":"Discard")+'</button><button class="btn btn-primary btn-sm" id="ab-save">'+(lang==="th"?"บันทึก & เผยแพร่":"Save & publish")+'</button>';
      document.getElementById("ab-cancel").onclick=function(){ if(confirm(lang==="th"?"ยกเลิกการเปลี่ยนแปลงที่ยังไม่บันทึก?":"Discard unsaved changes?")) location.reload(); };
      document.getElementById("ab-save").onclick=save;
    }
  }

  // ---------- publish ----------
  function escJson(s){ return s.replace(/</g,"\\u003c"); }
  function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }
  function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function buildDoc(){
    // Reconstruct our own tags from textContent + only the attributes we control.
    // Reading outerHTML would copy runtime-injected attributes (e.g. a CSP nonce)
    // that become stale on reload and silently block the script -> blank page.
    var styleEl=document.getElementById("app-style");
    var codeEl=document.getElementById("app-code");
    var fontsEl=document.getElementById("app-fonts");
    var fontsHref=fontsEl?fontsEl.getAttribute("href"):"";
    var fonts='<link id="app-fonts" rel="stylesheet" href="'+escAttr(fontsHref)+'">';
    var style='<style id="app-style">'+(styleEl?styleEl.textContent:"")+"<\/style>";
    var code='<script id="app-code">'+(codeEl?codeEl.textContent:"")+ENDS;
    var title=escHtml((data.brand&&data.brand.name)||"Website");
    var json=escJson(JSON.stringify(data));
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n"
      +"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n"
      +"<title>"+title+"<\/title>\n"
      +fonts+"\n"+style+"\n</head>\n<body>\n"
      +'<script id="site-data" type="application/json">'+json+ENDS+"\n"
      +"<div id=\"app\"></div>\n"+code+"\n</body>\n</html>";
  }
  function save(){
    if(Date.now()-editEnteredAt < 700){ return; } // ignore accidental double-click / rapid re-trigger
    syncEdits();
    var bar=document.getElementById("adminbar"); bar.classList.add("busy");
    document.getElementById("ab-msg").textContent=(lang==="th"?"กำลังบันทึก...":"Saving...");
    var html;
    try{ html=buildDoc(); }catch(e){ bar.classList.remove("busy"); toast("Build error"); renderAdminBar(); return; }
    (artifactNS?Promise.resolve(artifactNS):claude.use("artifact")).then(function(ns){
      artifactNS=ns;
      if(!ns){ bar.classList.remove("busy"); toast(lang==="th"?"บันทึกไม่ได้: ไม่มีสิทธิ์เผยแพร่":"Can't save: publishing unavailable"); renderAdminBar(); return; }
      return ns.publish(html).then(function(){
        // re-render in place so content is correct even if the runtime does not reload
        editing=false;
        bar.classList.remove("busy");
        try{ render(); }catch(e){}
        renderAdminBar();
        toast(lang==="th"?"บันทึกแล้ว!":"Saved!");
      }).catch(function(err){
        bar.classList.remove("busy");
        var code=err&&err.code;
        if(code==="conflict"){ toast(lang==="th"?"มีการแก้ไขซ้อน กำลังโหลดใหม่":"Someone else edited — reloading"); }
        else if(code==="not_writer"||code==="not_granted"){ toast(lang==="th"?"คุณไม่มีสิทธิ์แก้ไขหน้านี้":"You don't have edit access"); editing=false; applyEditing(); }
        else if(code==="too_large"){ toast(lang==="th"?"ไฟล์ใหญ่เกินไป ลองลดจำนวน/ขนาดรูป":"Too large — use fewer/smaller photos"); }
        else { toast((lang==="th"?"บันทึกไม่สำเร็จ: ":"Save failed: ")+(code||"error")); }
        renderAdminBar();
      });
    });
  }

  // ---------- toast ----------
  var toEl,toT;
  function toast(msg){
    if(!toEl){ toEl=document.createElement("div"); toEl.className="toast"; document.body.appendChild(toEl); }
    toEl.textContent=msg; toEl.classList.add("show");
    clearTimeout(toT); toT=setTimeout(function(){ toEl.classList.remove("show"); },3200);
  }

  // ---------- init ----------
  // While editing, tapping a link that wraps an editable field (tel:/mailto:/maps,
  // or in-page #anchors) must NOT navigate — that navigation blanks the frame.
  document.addEventListener("click", function(e){
    if(!editing) return;
    var a = (e.target && e.target.closest) ? e.target.closest("a") : null;
    if(a){ e.preventDefault(); }
  }, true);
  render();
  try{
    if(window.claude && typeof claude.use==="function"){
      claude.use("user").then(function(u){
        if(!u) return;
        return u.canEdit().then(function(ok){
          canEdit=!!ok;
          if(canEdit) buildAdminBar();
        });
      }).catch(function(){});
    }
  }catch(e){}
  }catch(fatal){ showBanner("⚠ "+(fatal&&fatal.message||fatal)); }
})();
</script>
