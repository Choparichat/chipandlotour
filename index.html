<style id="app-style">
  #live-reviews{margin-bottom:8px}
  body.live-site #adminbar{padding-right:230px}
  @media (max-width:760px){ body.live-site #adminbar{padding-right:16px;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))} }
  #reviews.has-live .rv-track,#reviews.has-live .rv-nav{display:none}
  #reviews.has-live{--bg:#151210;--surface:#201B16;--surface-2:#2A241D;--ink:#F2ECE1;--muted:#A79C8B;--border:#372F26;--primary:#2FA187;--primary-ink:#4FBFA3;color:var(--ink)}

  :root{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F4EFE6;
    --ink:#241F19; --muted:#6E665A; --border:#E7DFD1;
    --primary:#0F6E5C; --primary-ink:#0B5648; --gold:#B4832A;
    --shadow:0 1px 2px rgba(40,32,20,.06),0 8px 24px rgba(40,32,20,.06);
    --radius:16px; --maxw:1120px;
    --serif:"Fraunces","Noto Serif Thai",Georgia,serif;
    --sans:"Figtree","Noto Sans Thai",system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151210; --surface:#201B16; --surface-2:#2A241D;
      --ink:#F2ECE1; --muted:#A79C8B; --border:#372F26;
      --primary:#2FA187; --primary-ink:#4FBFA3; --gold:#D6A64A;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151210; --surface:#201B16; --surface-2:#2A241D;
    --ink:#F2ECE1; --muted:#A79C8B; --border:#372F26;
    --primary:#2FA187; --primary-ink:#4FBFA3; --gold:#D6A64A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  img{max-width:100%;display:block}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.12;letter-spacing:-.01em;text-wrap:balance;margin:0}
  a{color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px}
  .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:.5em;border:1px solid transparent;border-radius:999px;padding:.72em 1.4em;font-family:var(--sans);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .15s ease,border-color .15s ease;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:17px;height:17px;flex:none}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-ink)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-sm{padding:.5em 1em;font-size:.85rem}

  /* header */
  header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;gap:18px;height:66px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.28rem;font-weight:600;text-decoration:none;letter-spacing:-.01em}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--gold));display:grid;place-items:center;color:#fff;flex:none}
  .brand .logo svg{width:20px;height:20px}
  .brand .logo{position:relative}
  .brand .logo.img{background:#fff;width:auto;height:46px;max-width:180px;padding:4px;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.35)}
  .brand .logo.img img{height:38px;width:auto;max-width:170px;object-fit:contain;border-radius:8px;display:block}
  .logo-hint{display:none;position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:.7rem;font-weight:600;padding:.3em .7em;border-radius:999px;white-space:nowrap;pointer-events:none;z-index:5}
  body.editing .brand .logo{outline:1.5px dashed color-mix(in srgb,var(--primary) 70%,transparent);outline-offset:4px;cursor:pointer}
  body.editing .brand .logo:hover{filter:brightness(1.08)}
  body.editing .logo-hint{display:block}
  .logo-reset{display:none;width:24px;height:24px;border-radius:7px;border:0;background:rgba(180,40,30,.92);color:#fff;cursor:pointer;align-items:center;justify-content:center;flex:none;margin-left:-4px}
  .logo-reset svg{width:13px;height:13px}
  body.editing .logo-reset{display:inline-flex}
  .nav-links{display:flex;gap:22px;margin-left:8px}
  .nav-links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;padding:6px 2px;border-bottom:2px solid transparent}
  .nav-links a:hover{color:var(--ink)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .langtog{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;font-size:.82rem;font-weight:600}
  .langtog button{border:0;background:transparent;color:var(--muted);padding:.42em .8em;cursor:pointer;font-family:var(--sans);font-weight:600}
  .langtog button.on{background:var(--ink);color:var(--bg)}
  .menu-toggle{display:none;background:transparent;border:1px solid var(--border);border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--ink)}
  .menu-toggle svg{width:20px;height:20px}
  .hide-sm{display:inline-flex}

  /* hero */
  .hero{position:relative;overflow:hidden;z-index:0}
  .hero-media{position:absolute;inset:0}
  .hero-media .ph,.hero-media img{width:100%;height:100%;object-fit:cover}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(15,20,18,.28),rgba(15,20,18,.62))}
  .hero-inner{position:relative;z-index:2;padding-block:96px 104px;color:#fff;max-width:720px}
  .hero-inner .eyebrow{color:#ffe9b8}
  .hero h1{font-size:clamp(2.3rem,6vw,3.9rem);margin:.35em 0 .45em;color:#fff}
  .hero p.sub{font-size:clamp(1.02rem,2.2vw,1.22rem);color:rgba(255,255,255,.9);max-width:36em;margin:0 0 1.8em}
  .hero .cta-row{display:flex;gap:12px;flex-wrap:wrap}
  .hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.5)}
  .hero .btn-ghost:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}

  /* top bar */
  .topbar{background:var(--ink);color:var(--bg);font-size:.82rem}
  .topbar .wrap{display:flex;justify-content:flex-end;align-items:center;gap:8px;height:34px}
  .topbar a{color:inherit;text-decoration:none;opacity:.9;display:inline-flex;align-items:center;gap:6px}
  .topbar a:hover{opacity:1}
  .topbar svg{width:14px;height:14px}
  .hero p.tag{font-family:var(--serif);font-style:italic;color:#ffe9b8;font-size:clamp(1rem,2vw,1.15rem);margin:-.6em 0 1.8em;max-width:36em}
  /* moments strip */
  section.moments{padding-block:44px 8px}
  section.events{padding-block:56px 20px}
  .ev-grid{display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}
  .ev-grid.ev-n1{grid-template-columns:1fr} .ev-grid.ev-n2{grid-template-columns:1fr 1fr}
  .ev-card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer}
  body.editing .ev-card{cursor:default}
  .ev-media{position:relative;aspect-ratio:4/3;overflow:hidden}
  .ev-n1 .ev-media{aspect-ratio:21/9} .ev-n2 .ev-media{aspect-ratio:16/9}
  .ev-media>img,.ev-media>.ph{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .ev-card:hover .ev-media>img{transform:scale(1.04)}
  .ev-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.05) 55%);pointer-events:none;z-index:1}
  .ev-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 24px;color:#fff}
  .ev-cap h3{margin:.15em 0 .3em;font-family:var(--serif);font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.15;color:#fff}
  .ev-date{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
  .ev-more{display:inline-block;font-weight:600;font-size:.9rem;padding:.45em .9em;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
  .ev-card:hover .ev-more{background:var(--primary)}
  .ev-edit{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .ev-edit label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .ev-edit p{margin:0}
  .ev-view{padding:16px}
  .ev-box{position:relative;background:var(--surface);color:var(--ink);border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .ev-box .ev-x{position:absolute;top:10px;right:10px;z-index:3;background:rgba(0,0,0,.55);color:#fff}
  .ev-hero{position:relative;aspect-ratio:16/9;background:#000}
  .ev-hero>img,.ev-hero>.ph{width:100%;height:100%;object-fit:cover;display:block}
  .ev-thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
  .ev-thumbs img{width:70px;height:52px;object-fit:cover;border-radius:8px;opacity:.55;cursor:pointer;flex:none}
  .ev-thumbs img.on{opacity:1;outline:2px solid var(--primary)}
  .qr-view.ev-view .ev-thumbs img{width:70px;height:52px;display:inline-block}
  .qr-view.ev-view .ev-hero>img{width:100%;height:100%;object-fit:cover}
  .ev-body{padding:18px 22px 22px}
  .ev-body h3{font-family:var(--serif);font-size:1.6rem;margin:.2em 0 .4em}
  .ev-body p{color:var(--muted);line-height:1.7;margin:0 0 18px;white-space:pre-line}
  .ev-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px}
  .ev-pr{font-family:var(--serif);font-size:1.2rem}
  @media (max-width:760px){ .ev-grid,.ev-grid.ev-n2{grid-template-columns:1fr} .ev-n1 .ev-media{aspect-ratio:4/3} }
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .mcell{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;background:var(--surface-2)}
  .mcell .ph,.mcell img{width:100%;height:100%;object-fit:cover}
  .mcap{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;padding:.3em .85em;border-radius:999px;font-weight:600;font-size:.85rem;backdrop-filter:blur(4px)}
  /* services */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
  .fcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .fcard .ico{width:48px;height:48px;border-radius:14px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center}
  .fcard .ico svg{width:24px;height:24px}
  .fcard h3{font-size:1.3rem}
  .fcard p{margin:0;color:var(--muted);font-size:.98rem;flex:1}
  .fcard .btn{align-self:flex-start;margin-top:6px}

  /* generic section */
  section.blk{padding-block:72px}
  .sec-head{max-width:640px;margin-bottom:38px}
  .sec-head h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin:.25em 0 .3em}
  .sec-head p{color:var(--muted);margin:0;font-size:1.05rem}

  /* about points */
  .points{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .point{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .point .ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center;margin-bottom:14px}
  .point .ico svg{width:23px;height:23px}
  .point h3{font-size:1.2rem;margin-bottom:.35em}
  .point p{margin:0;color:var(--muted);font-size:.98rem}

  /* tours */
  .tours-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
  .tcard .media{aspect-ratio:4/3;position:relative;overflow:hidden}
  .tcard .media .ph,.tcard .media img{width:100%;height:100%;object-fit:cover}
  .tcard .region{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:.74rem;font-weight:600;letter-spacing:.04em;padding:.32em .7em;border-radius:999px;backdrop-filter:blur(4px)}
  .tcard .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .tcard h3{font-size:1.28rem}
  .tcard .desc{color:var(--muted);font-size:.96rem;margin:0;flex:1}
  .tcard .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px;padding-top:14px;border-top:1px solid var(--border)}
  .tcard .dur{color:var(--muted);font-size:.88rem;display:inline-flex;align-items:center;gap:.4em}
  .tcard .dur svg{width:14px;height:14px;opacity:.7;flex:none}
  .tcard .price{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
  .tcard .price b{color:var(--primary);font-weight:600}
  .tcard .act{margin-top:12px}
  .tcard .act .btn{width:100%;justify-content:center}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;gap:14px;grid-auto-flow:dense}
  .gcell{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2)}
  .gcell.gs-tall{grid-row:span 2} .gcell.gs-wide{grid-column:span 2} .gcell.gs-big{grid-row:span 2;grid-column:span 2}
  .gcell img{cursor:zoom-in;transition:transform .35s ease} .gcell:hover img{transform:scale(1.03)} body.editing .gcell img{cursor:default;transform:none}
  .gsize{display:none;position:absolute;left:8px;top:8px;z-index:7;align-items:center;gap:6px;padding:6px 10px;border:0;border-radius:9px;background:rgba(20,16,12,.82);color:#fff;font:600 12px/1 inherit;cursor:pointer}
  .gsize:hover{background:rgba(20,16,12,.95)} .gsize svg{width:14px;height:14px}
  body.editing .gsize{display:inline-flex}
  .gcell .ph,.gcell img{width:100%;height:100%;object-fit:cover}

  /* reviews */
  .rv-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .rv-top .sec-head{margin-bottom:0}
  .rv-nav{display:flex;gap:8px}
  .rv-nav button{width:42px;height:42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
  .rv-nav button:hover{border-color:var(--primary);color:var(--primary)}
  .rv-nav svg{width:18px;height:18px}
  .rv-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 14px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .rv-card{position:relative;flex:0 0 min(340px,84vw);scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .rv-head{display:flex;align-items:center;gap:12px}
  .rv-av{width:40px;height:40px;border-radius:999px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .rv-name{font-weight:700;line-height:1.3}
  .rv-date{font-size:.82rem;color:var(--muted)}
  .rv-stars{display:flex;gap:2px;color:#E8A317}
  .rv-stars span{font-size:1.1rem;line-height:1}
  .rv-stars span.off{color:var(--border)}
  body.editing .rv-stars span{cursor:pointer}
  .rv-text{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin:0;color:var(--ink);font-size:.97rem;flex:1}
  .rv-card.open .rv-text,body.editing .rv-text{-webkit-line-clamp:unset;display:block}
  .rv-track{align-items:flex-start}
  .rv-toggle{display:none;align-self:flex-start;border:0;background:none;padding:0;color:var(--primary);font:600 .88rem var(--sans);cursor:pointer}
  .rv-toggle.show{display:inline}
  body.editing .rv-toggle{display:none}
  .rv-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .rv-ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
  .rv-ph img{width:100%;height:100%;object-fit:cover}
  .rv-ph .more{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;font-weight:700;font-size:1.1rem;display:grid;place-items:center}
  .rv-ph .x{display:none;position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(180,40,30,.95);color:#fff;cursor:pointer;align-items:center;justify-content:center}
  .rv-ph .x svg{width:12px;height:12px}
  body.editing .rv-ph .x{display:flex}
  body.editing .rv-ph{cursor:default}
  .rv-phadd{display:none;aspect-ratio:1;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--primary) 60%,transparent);background:transparent;color:var(--primary);font:600 .72rem var(--sans);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .rv-phadd svg{width:18px;height:18px}
  body.editing .rv-phadd{display:flex}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.9);color:#241F19;cursor:pointer;display:grid;place-items:center;font-size:1.4rem}
  .lb-prev{left:14px}.lb-next{right:14px}
  .qr-view .box.photo{max-width:min(720px,100%);padding:10px}
  .qr-view .box.photo img{width:min(600px,84vw);max-height:78vh;object-fit:contain;margin:0 auto}
  .rw-box{background:var(--surface);color:var(--ink);border-radius:20px;padding:26px;width:min(460px,100%);max-height:90vh;overflow:auto;text-align:left;position:relative}
  .rw-box h3{font-size:1.4rem;margin-bottom:.3em}
  .rw-box .hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
  .rw-box label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
  .rw-box input,.rw-box textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.7em .85em}
  .rw-box textarea{min-height:120px;resize:vertical}
  .rw-box input:focus,.rw-box textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
  .rw-stars{display:flex;gap:4px}
  .rw-stars button{border:0;background:none;font-size:1.9rem;line-height:1;color:var(--border);cursor:pointer;padding:0 2px}
  .rw-stars button.on{color:#E8A317}
  .rw-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .rw-actions .btn{justify-content:center;width:100%}
  .rw-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.2rem;line-height:1}
  .rw-err{color:#b4281e;font-size:.88rem;margin-top:8px;min-height:1.2em}
  body.editing .rv-write{display:none}
  .rv-src{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .rv-src b{font-weight:700;background:linear-gradient(90deg,#4285F4,#EA4335,#FBBC05,#34A853);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rv-more{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .rv-url{display:none;font-size:.85rem;color:var(--muted)}
  body.editing .rv-url{display:block;flex-basis:100%}
  .rv-empty{display:none;color:var(--muted);font-size:.95rem;padding:18px;border:1.5px dashed var(--border);border-radius:var(--radius)}
  body.editing .rv-empty{display:block}
  .ph{background:linear-gradient(150deg,var(--c1,#0F6E5C),var(--c2,#123B4E));display:grid;place-items:center;position:relative}
  .ph::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 22% 78%,rgba(255,255,255,.14),transparent 42%),radial-gradient(circle at 82% 22%,rgba(255,255,255,.1),transparent 40%)}
  .ph svg{width:34px;height:34px;opacity:.55;color:#fff;position:relative}

  /* contact */
  .map-wrap{position:relative;margin-top:36px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);background:var(--surface-2);height:380px}
  .map-wrap iframe{display:block;width:100%;height:100%;border:0}
  .map-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
  .map-open{position:absolute;left:14px;bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .map-q{display:none;margin-top:10px;font-size:.85rem;color:var(--muted)} body.editing .map-q{display:block}
  @media (max-width:760px){ .map-wrap{height:280px} }
  .contact-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
  .clist{display:flex;flex-direction:column;gap:2px}
  .crow{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border)}
  .crow:last-child{border-bottom:0}
  .crow .ico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--surface-2);color:var(--primary);display:grid;place-items:center}
  .crow .ico svg{width:20px;height:20px}
  .crow .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .crow .val{font-weight:600;word-break:break-word}
  .crow .val a{text-decoration:none}
  .crow .val a:hover{color:var(--primary)}
  .crow .val a.ext{border-bottom:1px dashed currentColor} .crow .val a.ext::after{content:" ↗";font-size:.8em;opacity:.55}
  body.editing .crow .val a.ext{border-bottom:0} body.editing .crow .val a.ext::after{content:""}
  .contact-cta{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
  .contact-media{position:relative;margin:-30px -30px 24px;aspect-ratio:16/10;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0}
  .contact-media .ph,.contact-media img{width:100%;height:100%;object-fit:cover}
  .contact-cta{overflow:hidden}
  .crow .cbody{flex:1;min-width:0}
  .qr-wrap{margin-top:12px;display:flex}
  .soc-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
  .soc{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
  .soc svg{width:18px;height:18px;color:#1877F2;flex:none}
  .soc:hover{border-color:#1877F2}
  .soc-foot{display:flex;gap:8px;order:3;width:100%;justify-content:center;flex-wrap:wrap}
  .soc-foot .soc{padding:6px 12px;font-size:.8rem;background:transparent}
  .soc-foot [data-socedit]{display:none}
  .vid-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
  .vid{width:300px;max-width:100%;display:flex;flex-direction:column;gap:10px}
  .vid iframe{width:100%;aspect-ratio:9/16;border:0;border-radius:16px;background:#000;box-shadow:var(--shadow)}
  .vid-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem}
  .vid-link svg{width:16px;height:16px;color:#1877F2}

  function compressLogo(file,maxDim){
    var MAX=maxDim||480;
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ URL.revokeObjectURL(url);
        var w=img.naturalWidth||480,h=img.naturalHeight||480,m=Math.max(w,h);
        if(m>MAX){ var sc=MAX/m; w=Math.round(w*sc); h=Math.round(h*sc); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL("image/png")); }catch(e){ rej(e); }
      };
      img.onerror=rej; img.src=url;
    });
  }
  function compress(file,maxDim,q){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ URL.revokeObjectURL(url);
        var w=img.naturalWidth,h=img.naturalHeight,m=Math.max(w,h);
        if(m>maxDim){ var sc=maxDim/m; w=Math.round(w*sc); h=Math.round(h*sc); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL("image/jpeg",q)); }catch(e){ rej(e); }
      };
      img.onerror=rej; img.src=url;
    });
  }

  function escJson(s){ return s.replace(/</g,"\\u003c"); }
  function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

  function buildDoc(){
    // Reconstruct our own tags from textContent + only the attributes we control.
    // Reading outerHTML would copy runtime-injected attributes (e.g. a CSP nonce)
    // that become stale on reload and silently block the script -> blank page.
    var styleEl=document.getElementById("app-style");
    var codeEl=document.getElementById("app-code");
    var fontsEl=document.getElementById("app-fonts");
    var fontsHref=fontsEl?fontsEl.getAttribute("href"):"";
    var fonts='<link id="app-fonts" rel="stylesheet" href="'+escAttr(fontsHref)+'">';
    var style='<style id="app-style">'+(styleEl?styleEl.textContent:"")+"<\/style>";
    var code='<script id="app-code">'+(codeEl?codeEl.textContent:"")+ENDS;
    var title=escHtml((data.brand&&data.brand.name)||"Website");
    var json=escJson(JSON.stringify(data));
    var desc=escAttr(((data.hero&&data.hero.sub_en)||"").replace(/\s+/g," ").trim());
    var ttl=escAttr((data.brand&&data.brand.name)||"Website"), icon=(data.brand&&data.brand.logo)||"";
    var meta='<meta name="description" content="'+desc+'">\n<meta property="og:type" content="website">\n<meta property="og:title" content="'+ttl+'">\n<meta property="og:description" content="'+desc+'">\n'+(icon?'<link rel="icon" href="'+escAttr(icon)+'">\n':'');
    var live='<!-- วิดเจ็ตรีวิว Google: วางโค้ดวิดเจ็ตไว้ใน div ด้านล่างนี้ -->\n<div id="live-reviews" hidden>'+LIVE_SRC+'</div>\n';
    return "<!doctype html>\n<html lang=\"en\" data-theme=\"dark\">\n<head>\n<meta charset=\"utf-8\">\n"
      +"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n"
      +"<title>"+title+"<\/title>\n"+meta
      +fonts+"\n"+style+"\n</head>\n<body>\n"
      +'<script id="site-data" type="application/json">'+json+ENDS+"\n"
      +"<div id=\"app\"></div>\n"+live+code+"\n</body>\n</html>";
  }

  function gh(cfg,method,path,body){
    return fetch("https://api.github.com/repos/"+cfg.repo+path,{method:method,cache:"no-store",
      headers:{"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){ var e=new Error(j.message||("HTTP "+r.status)); e.status=r.status; throw e; } return j; }); });
  }
  function b64utf8(str){ var by=new TextEncoder().encode(str), bin="", CH=0x8000;
    for(var i=0;i<by.length;i+=CH) bin+=String.fromCharCode.apply(null,by.subarray(i,i+CH)); return btoa(bin); }
  var uploadedImg={};
  function sha1hex(str){ return crypto.subtle.digest("SHA-1",new TextEncoder().encode(str)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); }); }
  function prepareSave(){
    // copy of data where every embedded image becomes a file under images/
    var files=[], jobs=[];
    function walk(o){
      if(Array.isArray(o)) return o.map(walk);
      if(o&&typeof o==="object"){ var r={}; for(var k in o) r[k]=walk(o[k]); return r; }
      if(typeof o==="string"&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(o)){
        if(uploadedImg[o]) return uploadedImg[o];
        var ph={__img:o}; jobs.push(ph); return ph;
      }
      return o;
    }
    var copy=walk(data);
    return Promise.all(jobs.map(function(ph){
      var m=ph.__img.match(/^data:image\/(\w+);base64,(.*)$/), ext=m[1]==="jpeg"?"jpg":m[1];
      return sha1hex(ph.__img).then(function(h){ var path="images/"+h.slice(0,16)+"."+ext; if(!files.some(function(f){ return f.path===path; })) files.push({path:path,b64:m[2]}); ph.__path=path; });
    })).then(function(){
      function fix(o){ if(Array.isArray(o)) return o.map(fix); if(o&&typeof o==="object"){ if(o.__img) return o.__path; var r={}; for(var k in o) r[k]=fix(o[k]); return r; } return o; }
      var out=fix(copy);
      jobs.forEach(function(ph){ uploadedImg[ph.__img]=ph.__path; });
      files.push({path:"data.json",b64:b64utf8(JSON.stringify(out))});
      return files;
    });
  }
  function ghCommitFiles(cfg,files){
    var br=cfg.branch||"main", head, base, tree=[];
    return gh(cfg,"GET","/git/ref/heads/"+encodeURIComponent(br)).then(function(r){ head=r.object.sha; return gh(cfg,"GET","/git/commits/"+head); })
      .then(function(c){ base=c.tree.sha;
        return files.reduce(function(p,f){ return p.then(function(){ return gh(cfg,"POST","/git/blobs",{content:f.b64,encoding:"base64"}).then(function(b){ tree.push({path:f.path,mode:"100644",type:"blob",sha:b.sha}); }); }); },Promise.resolve()); })
      .then(function(){ return gh(cfg,"POST","/git/trees",{base_tree:base,tree:tree}); })
      .then(function(t){ var d=new Date(); return gh(cfg,"POST","/git/commits",{message:"Edit from website "+d.toISOString().slice(0,16).replace("T"," "),tree:t.sha,parents:[head]}); })
      .then(function(c){ return gh(cfg,"PATCH","/git/refs/heads/"+encodeURIComponent(br),{sha:c.sha}); });
  }
  function ghCommit(cfg,content){
    var br=cfg.branch||"main", head, base;
    return gh(cfg,"GET","/git/ref/heads/"+encodeURIComponent(br)).then(function(r){ head=r.object.sha; return gh(cfg,"GET","/git/commits/"+head); })
      .then(function(c){ base=c.tree.sha; return gh(cfg,"POST","/git/blobs",{content:b64utf8(content),encoding:"base64"}); })
      .then(function(b){ return gh(cfg,"POST","/git/trees",{base_tree:base,tree:[{path:(cfg.path||"data.json"),mode:"100644",type:"blob",sha:b.sha}]}); })
      .then(function(t){ var d=new Date(); return gh(cfg,"POST","/git/commits",{message:"Edit from website "+d.toISOString().slice(0,16).replace("T"," "),tree:t.sha,parents:[head]}); })
      .then(function(c){ return gh(cfg,"PATCH","/git/refs/heads/"+encodeURIComponent(br),{sha:c.sha}); });
  }

  function save(){

      if(!ns){ bar.classList.remove("busy"); toast(lang==="th"?"บันทึกไม่ได้: ไม่มีสิทธิ์เผยแพร่":"Can't save: publishing unavailable"); renderAdminBar(); return; }

        // re-render in place so content is correct even if the runtime does not reload
